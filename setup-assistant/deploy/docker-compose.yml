# Запуск бота «Настройка Cardinal с ассистентом» в Docker.
# Использование (из корня проекта):
#   cp .env.example .env  и заполнить BOT_TOKEN
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  setup-assistant:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: setup-assistant
    env_file: ../.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
